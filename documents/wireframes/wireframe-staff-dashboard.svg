  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- CARD 1 — PENDING (Room 101)                               -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="30" y="220" width="840" height="128" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <rect x="30" y="220" width="5" height="128" fill="#667eea" rx="3"/>

  <text x="48" y="242" font-size="12" font-weight="bold" fill="#667eea">Req. No : 97 | Room No : 101</text>
  <rect x="760" y="226" width="74" height="20" fill="#fefcbf" stroke="#d69e2e" stroke-width="1" rx="10"/>
  <text x="797" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#b7791f">Pending</text>

  <text x="48" y="262" font-size="11" fill="#333">I need extra pillows</text>

  <rect x="48" y="270" width="90" height="18" fill="#c6f6d5" stroke="#68d391" stroke-width="1" rx="9"/>
  <text x="93" y="283" text-anchor="middle" font-size="9" font-weight="bold" fill="#276749">Housekeeping</text>
  <text x="150" y="283" font-size="10" fill="#555">Intent: pillow_request</text>
  <text x="680" y="283" font-size="10" fill="#999">Time: 1 min ago</text>

  <rect x="48" y="294" width="98" height="24" fill="#ed8936" stroke="#dd6b20" stroke-width="1" rx="4"/>
  <text x="97" y="311" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Start Working</text>
  <rect x="156" y="294" width="98" height="24" fill="#48bb78" stroke="#38a169" stroke-width="1" rx="4"/>
  <text x="205" y="311" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Mark Complete</text>
  <rect x="264" y="294" width="112" height="24" fill="white" stroke="#cbd5e0" stroke-width="1" rx="4"/>
  <text x="320" y="311" text-anchor="middle" font-size="10" fill="#444">Housekeeping &#8964;</text>

  <rect x="48" y="326" width="718" height="18" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="58" y="339" font-size="9" fill="#aaa" font-style="italic">Send message to guest in Room 101...</text>
  <rect x="774" y="324" width="44" height="22" fill="#667eea" rx="4"/>
  <text x="796" y="339" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Send</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- CARD 2 — PENDING (Room 205)                               -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="30" y="358" width="840" height="128" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <rect x="30" y="358" width="5" height="128" fill="#667eea" rx="3"/>

  <text x="48" y="380" font-size="12" font-weight="bold" fill="#667eea">Req. No : 96 | Room No : 205</text>
  <rect x="760" y="364" width="74" height="20" fill="#fefcbf" stroke="#d69e2e" stroke-width="1" rx="10"/>
  <text x="797" y="378" text-anchor="middle" font-size="9" font-weight="bold" fill="#b7791f">Pending</text>

  <text x="48" y="400" font-size="11" fill="#333">Please clean my room</text>

  <rect x="48" y="408" width="90" height="18" fill="#c6f6d5" stroke="#68d391" stroke-width="1" rx="9"/>
  <text x="93" y="421" text-anchor="middle" font-size="9" font-weight="bold" fill="#276749">Housekeeping</text>
  <text x="150" y="421" font-size="10" fill="#555">Intent: room_cleaning</text>
  <text x="680" y="421" font-size="10" fill="#999">Time: 4 mins ago</text>

  <rect x="48" y="432" width="98" height="24" fill="#ed8936" stroke="#dd6b20" stroke-width="1" rx="4"/>
  <text x="97" y="449" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Start Working</text>
  <rect x="156" y="432" width="98" height="24" fill="#48bb78" stroke="#38a169" stroke-width="1" rx="4"/>
  <text x="205" y="449" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Mark Complete</text>
  <rect x="264" y="432" width="112" height="24" fill="white" stroke="#cbd5e0" stroke-width="1" rx="4"/>
  <text x="320" y="449" text-anchor="middle" font-size="10" fill="#444">Housekeeping &#8964;</text>

  <rect x="48" y="464" width="718" height="18" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="58" y="477" font-size="9" fill="#aaa" font-style="italic">Send message to guest in Room 205...</text>
  <rect x="774" y="462" width="44" height="22" fill="#667eea" rx="4"/>
  <text x="796" y="477" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Send</text>

  <!-- Scroll indicator -->
  <text x="450" y="510" text-anchor="middle" font-size="9" fill="#bbb" font-style="italic">— scrolls down —</text>

  <!-- ── CONNECTION STATUS BAR ── -->
  <line x1="20" y1="522" x2="880" y2="522" stroke="#eee" stroke-width="1"/>
  <circle cx="620" cy="543" r="5" fill="#48bb78"/>
  <text x="630" y="547" font-size="10" fill="#48bb78">Connected to http://192.168.1.100:8000</text>

  <!-- Panel label -->
  <text x="450" y="592" text-anchor="middle" font-size="10" fill="#666" font-style="italic">Staff Dashboard Panel</text>

</svg>
