<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="600" fill="#f2f2f2" rx="4"/>

  <!-- Title -->
  <text x="450" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Figure: Staff Dashboard — Housekeeping View Wireframe</text>

  <!-- ── MAIN PANEL ── -->
  <rect x="20" y="40" width="860" height="542" fill="white" stroke="#aaa" stroke-width="1.5" rx="6"/>

  <!-- ── HEADER ── -->
  <rect x="20" y="40" width="860" height="54" fill="white" stroke="#aaa" stroke-width="1.5" rx="6"/>
  <rect x="20" y="70" width="860" height="24" fill="white"/>
  <text x="40" y="74" font-size="16" font-weight="bold" fill="#222">Housekeeping Dashboard</text>
  <rect x="738" y="50" width="60" height="24" fill="#667eea" rx="12"/>
  <text x="768" y="67" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Dinesh</text>
  <rect x="806" y="50" width="60" height="24" fill="#e53e3e" rx="4"/>
  <text x="836" y="67" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Logout</text>
  <line x1="20" y1="94" x2="880" y2="94" stroke="#ddd" stroke-width="1"/>

  <!-- ── STATS ROW ── -->
  <rect x="30" y="102" width="198" height="72" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="50" y="124" font-size="11" fill="#666">Pending Requests</text>
  <text x="50" y="158" font-size="26" font-weight="bold" fill="#667eea">29</text>

  <rect x="238" y="102" width="198" height="72" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="258" y="124" font-size="11" fill="#666">In Progress</text>
  <text x="258" y="158" font-size="26" font-weight="bold" fill="#667eea">0</text>

  <rect x="446" y="102" width="198" height="72" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="466" y="124" font-size="11" fill="#666">Completed</text>
  <text x="466" y="158" font-size="26" font-weight="bold" fill="#667eea">1</text>

  <rect x="654" y="102" width="196" height="72" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="674" y="124" font-size="11" fill="#666">Cancelled</text>
  <text x="674" y="158" font-size="26" font-weight="bold" fill="#667eea">8</text>

  <!-- ── REQUESTS HEADING ── -->
